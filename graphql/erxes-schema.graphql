# Erxes GraphQL Schema
# Source: https://github.com/erxes/erxes (monorepo — backend/core-api and backend/plugins)
# Architecture: Apollo Federation v2 — each plugin is a subgraph federated at port 4000.
# Scalar and directive definitions cover the full platform surface.

scalar Date
scalar JSON

directive @key(fields: String!) on OBJECT | INTERFACE
directive @external on FIELD_DEFINITION
directive @requires(fields: String!) on FIELD_DEFINITION
directive @provides(fields: String!) on FIELD_DEFINITION
directive @cacheControl(maxAge: Int) on OBJECT | FIELD_DEFINITION

