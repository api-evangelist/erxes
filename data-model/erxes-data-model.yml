note: >-
  Derived from the harvested GraphQL SDL, not from an OpenAPI (erxes publishes
  none). Relationships are read two ways, both visible in the schema: an
  explicit resolved field whose type is another entity (Customer.owner: User),
  and an id-reference scalar field (Customer.ownerId: String). Where both exist
  the pair is recorded with `via`. Only entities present in the harvested SDL
  are listed; the schema covers the erxes CORE subgraph (128 types), so plugin
  subgraphs — sales deals, frontline tickets/conversations, operation
  tasks/projects, block units — are named under `federated_subgraphs` rather
  than modelled, because their SDL is not in this repo.
identity:
  primary_key: _id
  key_type: String (MongoDB ObjectId string)
  id_prefixes: none — erxes uses opaque ObjectId strings with no type prefix
  federation_key: '@key(fields: "_id")'
  note: >-
    Because ids carry no type prefix, an id alone does not tell a caller (or an
    agent) which entity it addresses. The provider's own agent instructions
    compensate by requiring a search/list step before any write that takes an
    _id.
