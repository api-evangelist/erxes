federated_subgraphs:
  note: >-
    Each erxes plugin exposes its own subgraph, federated into one gateway
    schema. These entities are real and their operations are documented in the
    provider's agent-plugin references, but their SDL is not in
    graphql/erxes-schema.graphql, so they are named rather than modelled.
  subgraphs:
    - {name: core, modelled: true, entities: [Customer, Company, User, Branch, Department, Position, Tag, Segment, Organization, OAuthClientApp, PermissionGroup, Notification]}
    - {name: sales_api, modelled: false, entities: [Deal, Pipeline, Stage, Product, ProductCategory, Uom]}
    - {name: frontline_api, modelled: false, entities: [Conversation, Ticket, Integration, Channel, KnowledgeBase, Form]}
    - {name: operation_api, modelled: false, entities: [Project, Task, Triage, Team, Status, Cycle, Milestone, Note, Activity, Template], reference: skills/erxes-operation-plugin-workflows.md}
    - {name: block_api, modelled: false, entities: [Project, Building, FloorZoning, Unit, UnitType, Opportunity, Status, PaymentPlan, Contract, Offer, Invoice], reference: skills/erxes-block-plugin-workflows.md}
    - {name: loyalty_api, modelled: false}
    - {name: payment_api, modelled: false}
polymorphism:
  note: >-
    Tag and Segment are both polymorphic over a `type`/`contentType` string
    rather than over a union. `tagsGetTypes` returns the live list of taggable
    content types, which is the only way to enumerate them — the vocabulary is
    not published statically.
