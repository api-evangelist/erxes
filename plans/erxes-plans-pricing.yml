note: >-
  erxes publishes plan TIERS with quotas but NOT PRICES. Every tier on the
  self-service pricing pages renders its feature/quota matrix with no monetary
  amount attached, and every edition page (Enterprise, Embed, Platform,
  Infrastructure) routes to "Talk to sales". Only the Free tier and the
  self-hosted Community Edition carry a stated price, and that price is zero.
  Pricing is segmented per product module — Frontline, Sales, Marketing,
  Operation, Commerce and Content each have their own /pricing/self-service/
  page — so the tier names below are the Frontline module's. Quotas verified
  against the live page on 2026-08-13; note the third tier is labelled
  "Messenger" on the page today (it was captured as "Enterprise" in the June
  2026 pass in plans/erxes-plans.md), with the same quota column.
