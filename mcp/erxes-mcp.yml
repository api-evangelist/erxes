note: >-
  erxes SHIPS NO MCP SERVER. Searched the erxes GitHub organization (41
  repositories), the 11,527-file monorepo tree (zero matches for "mcp"), the
  docs, and the web. What erxes does ship is a first-class agent surface in a
  DIFFERENT protocol: an OpenClaw/Clawhub agent plugin ("erxes-next-plugin"
  v1.0.23) published at github.com/erxes/erxes-skills, saved verbatim in
  skills/ and wired as AgentSkill. Because no MCP server exists, `mode: none`
  and NO `MCPServer` pointer is wired into apis.yml — asserting one would
  credit erxes with an agent surface it has not shipped. The tools[] list below
  is a CANDIDATE derived from the operations erxes itself publishes in its
  agent-plugin GraphQL reference; every tool maps to a real, documented GraphQL
  operation and a real OAuth scope. Nothing here is invented, and nothing here
  is live.
