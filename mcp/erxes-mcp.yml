input_schemas:
  available: false
  reason: >-
    A real inputSchema per tool would come from GraphQL introspection, which
    erxes has disabled on its gateway (INTROSPECTION_DISABLED). Argument shapes
    for the core operations can be read from graphql/erxes-schema.graphql,
    which was harvested from the erxes source rather than from a live schema.
crosswalk:
  emitted: false
  reason: >-
    mcp/<slug>-tool-crosswalk.yml binds MCP tools to backing OpenAPI
    operationIds. erxes has neither an MCP server nor an OpenAPI, so there are
    no two surfaces to reconcile. The scope-to-operation binding that would
    otherwise live in a crosswalk is already carried on each tool above and in
    scopes/erxes-scopes.yml.
