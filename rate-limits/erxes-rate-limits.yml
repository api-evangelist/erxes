    - {plan: Enterprise, contacts: 200000, emails_per_month: 30000, team_members: 10}
    - {plan: Self-Hosted, contacts: unlimited, emails_per_month: 'bounded by your SMTP/ESP', team_members: unlimited}
retry_guidance:
  outbound_from_erxes:
    retryable_status_codes: [408, 425, 429, 500, 502, 503, 504]
    strategy: exponential backoff
    source: backend/services/automations/src/executions/actions/webhook/outgoing/outgoingWebhook.ts
  inbound_to_erxes: 'No published guidance. Integrators should back off on 429 and honor RateLimit-Reset on the webhook endpoints.'
